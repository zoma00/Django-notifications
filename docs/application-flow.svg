<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc">
  <title id="title">Django Notifications application flow</title>
  <desc id="desc">Authenticated clients enter through Django's ASGI protocol router. HTTP requests use Django REST Framework viewsets, caching, and the Notification model stored in SQLite. WebSocket connections use Channels and per-user consumer groups. New notification events reach the channel layer for real-time JSON delivery, while Celery uses Redis as its broker to process unread notifications asynchronously.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .heading { font-size: 28px; font-weight: 700; fill: #ffffff; }
      .subtitle { font-size: 16px; font-weight: 500; fill: #bae6fd; }
      .label { font-size: 19px; font-weight: 700; fill: #0f172a; }
      .copy { font-size: 15px; font-weight: 500; fill: #334155; }
      .small { font-size: 14px; font-weight: 600; fill: #475569; }
      .pill { font-size: 14px; font-weight: 700; fill: #075985; }
      .arrow { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .return { fill: none; stroke: #0284c7; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="720" height="1080" rx="24" fill="#f8fafc"/>

  <rect x="20" y="20" width="680" height="94" rx="18" fill="#075985"/>
  <text x="360" y="59" text-anchor="middle" class="heading">Django Notifications</text>
  <text x="360" y="88" text-anchor="middle" class="subtitle">REST, WebSocket, Channels, Celery, and Redis flow</text>

  <rect x="150" y="142" width="420" height="82" rx="16" fill="#ffffff" stroke="#38bdf8" stroke-width="2"/>
  <text x="360" y="176" text-anchor="middle" class="label">Authenticated Client</text>
  <text x="360" y="202" text-anchor="middle" class="copy">Browser UI or REST API consumer</text>

  <path d="M360 224 L360 260" class="arrow"/>

  <rect x="40" y="262" width="640" height="100" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="360" y="298" text-anchor="middle" class="label">Django ASGI Protocol Router</text>
  <text x="360" y="327" text-anchor="middle" class="copy">Routes HTTP requests and authenticated WebSocket connections</text>
  <text x="360" y="350" text-anchor="middle" class="small">Daphne · Django · AuthMiddlewareStack</text>

  <path d="M245 362 L245 404" class="arrow"/>
  <path d="M475 362 L475 404" class="arrow"/>

  <rect x="40" y="406" width="310" height="160" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <text x="195" y="441" text-anchor="middle" class="label">HTTP / REST Path</text>
  <text x="195" y="470" text-anchor="middle" class="copy">DRF ModelViewSet + serializer</text>
  <text x="195" y="496" text-anchor="middle" class="copy">IsAuthenticated access control</text>
  <line x1="68" y1="516" x2="322" y2="516" stroke="#a7f3d0" stroke-width="2"/>
  <text x="195" y="544" text-anchor="middle" class="small">List · create · retrieve · update</text>

  <rect x="370" y="406" width="310" height="160" rx="16" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="525" y="441" text-anchor="middle" class="label">WebSocket Path</text>
  <text x="525" y="470" text-anchor="middle" class="copy">/ws/notifications/</text>
  <text x="525" y="496" text-anchor="middle" class="copy">Async NotificationConsumer</text>
  <line x1="398" y1="516" x2="652" y2="516" stroke="#ddd6fe" stroke-width="2"/>
  <text x="525" y="544" text-anchor="middle" class="small">Per-user group: user_{id}</text>

  <path d="M195 566 L195 605" class="arrow"/>

  <rect x="40" y="607" width="640" height="112" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="360" y="643" text-anchor="middle" class="label">Notification Data Layer</text>
  <text x="360" y="672" text-anchor="middle" class="copy">Per-user query caching · model validation · cache invalidation</text>
  <rect x="179" y="687" width="362" height="24" rx="12" fill="#d1fae5"/>
  <text x="360" y="704" text-anchor="middle" class="pill">Notification model → SQLite development database</text>

  <path d="M245 719 L245 760" class="arrow"/>
  <path d="M475 719 L475 760" class="arrow"/>

  <rect x="40" y="762" width="310" height="158" rx="16" fill="#ffffff" stroke="#f97316" stroke-width="2"/>
  <text x="195" y="797" text-anchor="middle" class="label">Real-Time Event Path</text>
  <text x="195" y="826" text-anchor="middle" class="copy">Create action / post-save signal</text>
  <text x="195" y="852" text-anchor="middle" class="copy">Channels group_send</text>
  <line x1="68" y1="872" x2="322" y2="872" stroke="#fed7aa" stroke-width="2"/>
  <text x="195" y="900" text-anchor="middle" class="small">In-memory layer in development</text>

  <rect x="370" y="762" width="310" height="158" rx="16" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="525" y="797" text-anchor="middle" class="label">Batch Processing Path</text>
  <text x="525" y="826" text-anchor="middle" class="copy">Celery shared task</text>
  <text x="525" y="852" text-anchor="middle" class="copy">Queries unread notifications</text>
  <line x1="398" y1="872" x2="652" y2="872" stroke="#fecaca" stroke-width="2"/>
  <text x="525" y="900" text-anchor="middle" class="small">Redis task broker</text>

  <path d="M195 920 L195 956" class="arrow"/>
  <path d="M525 920 L525 956" class="arrow"/>

  <rect x="40" y="958" width="310" height="76" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="195" y="990" text-anchor="middle" class="label">Channels Delivery</text>
  <text x="195" y="1017" text-anchor="middle" class="copy">JSON message to WebSocket client</text>

  <rect x="370" y="958" width="310" height="76" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="525" y="990" text-anchor="middle" class="label">Celery Worker</text>
  <text x="525" y="1017" text-anchor="middle" class="copy">Processes pending batch records</text>

  <path d="M40 996 L22 996 L22 183 L150 183" class="return"/>
</svg>
